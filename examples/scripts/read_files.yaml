# Scripted model for files.md on the fake provider.
#
# What to look for in the trace:
#   step 1  read_file docs/roadmap.txt  -> allowed by paths_within, executed
#   step 2  read_file ../secrets/keys.txt -> BLOCKED by paths_within (cited)
#   step 3  the model acknowledges and stops
# The lesson: a read-only tool confined to an allowlist; the escape attempt is
# refused and recorded, and nothing outside ./docs is ever read.
responses:
  - tool_calls:
      - name: read_file
        arguments: { path: "docs/roadmap.txt" }

  - tool_calls:
      - name: read_file
        arguments: { path: "../secrets/keys.txt" }

  - text: >
      I read the roadmap. I tried to read ../secrets/keys.txt but it is outside
      the allowed folder, so it was blocked. I won't attempt that again.
