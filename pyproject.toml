[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wicklight"
description = "A small, observable, safe-by-default agent harness."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Dat Nguyen" }]
keywords = ["agents", "llm", "harness", "observability", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/wicklight-agents/wicklight"
Repository = "https://github.com/wicklight-agents/wicklight"
Issues = "https://github.com/wicklight-agents/wicklight/issues"

[project.scripts]
wicklight = "wicklight.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.version]
path = "src/wicklight/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wicklight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
