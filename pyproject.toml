[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wicklight"
description = "A small, observable, safe-by-default agent harness."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Dat Nguyen" }]
keywords = ["agents", "llm", "harness", "observability", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["typer>=0.12", "ruamel.yaml>=0.18", "pydantic>=2.7"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/wicklight-agents/wicklight"
Repository = "https://github.com/wicklight-agents/wicklight"
Issues = "https://github.com/wicklight-agents/wicklight/issues"

[project.scripts]
wicklight = "wicklight.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.7",
]

[tool.hatch.version]
path = "src/wicklight/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wicklight"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "BLE",  # flake8-blind-except (no silently swallowed exceptions)
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["wicklight"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=wicklight --cov-report=term-missing"

[tool.coverage.run]
source = ["wicklight"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
