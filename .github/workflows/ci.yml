name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

  frontend:
    name: viewer frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/wicklight/viewer/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/wicklight/viewer/frontend
        run: npm ci

      - name: Type-check (svelte-check)
        working-directory: src/wicklight/viewer/frontend
        run: npm run check

      - name: Unit + component tests (vitest)
        working-directory: src/wicklight/viewer/frontend
        run: npm test

      - name: Build
        working-directory: src/wicklight/viewer/frontend
        run: npm run build

      - name: Committed assets are up to date
        # The built assets ship in the wheel, so a stale commit would ship stale
        # UI. Fail if `npm run build` changed anything that was committed.
        run: git diff --exit-code src/wicklight/viewer/assets

  viewer-wheel:
    name: viewer wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build the wheel
        run: uv build --wheel -o dist

      - name: Fresh install serves the viewer (assets ship in the wheel)
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/wicklight view examples/sample.jsonl \
            --no-browser --port 8799 &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8799/api/runs >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8799/api/runs | grep -q '"run_id"'
          curl -fsS http://127.0.0.1:8799/ | grep -q '<div id="app">'

  deployment:
    name: deployment (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      # ubuntu-latest ships Docker; build the image and run the sealed-deployment
      # integration suite (hardening, egress refusal, secrets, kill switch).
      - name: Deployment integration tests
        run: uv run pytest -m docker

  deployment-podman:
    name: deployment (podman)
    runs-on: ubuntu-latest
    # Keep the required gate fast: run the same suite under Podman on a schedule
    # and on main, not on every PR.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Deployment integration tests (Podman)
        env:
          WICKLIGHT_TEST_ENGINE: podman
        run: uv run pytest -m docker
